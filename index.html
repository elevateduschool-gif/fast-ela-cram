<style>
  :root{

  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}

  .meter-labels{display:flex;justify-content:space-between;font-size:.62rem;color:var(--muted);font-weight:700;margin-bottom:3px}
  .meter{position:relative;height:12px;background:#0d0820;border:1px solid var(--border);border-radius:999px;overflow:visible}
  .meter .fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--red),var(--orange),var(--gold),var(--green));width:0%;transition:width .6s cubic-bezier(.34,1.56,.64,1)}
  .meter .mark{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;left:74%}
  .meter .mark:after{content:"246";position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:.6rem;font-weight:900;color:#fff;white-space:nowrap}
  .meter .cursor{position:absolute;top:-5px;width:0;height:0;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--purple);transform:translateX(-50%);transition:left .6s cubic-bezier(.34,1.56,.64,1)}

  h2{font-size:1.05rem;font-weight:900;margin:16px 0 8px}

  .fb.part{background:rgba(249,115,22,.08);border-color:rgba(249,115,22,.35)}
  .fb .v{font-weight:900;font-size:.95rem;margin-bottom:6px;display:flex;align-items:center;gap:6px}
  .fb .why{color:#e7dcff}
  .fb .dis{margin-top:8px;padding-top:8px;border-top:1px dashed var(--border);color:var(--muted)}

  .fb .std{margin-top:8px;font-size:.68rem;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:.5px}
  .prog{display:flex;gap:5px;margin:10px 0 4px}
  .prog i{flex:1;height:6px;border-radius:4px;background:var(--border)}
  .prog i.done{background:var(--green)}

  .kv .val{font-weight:900}

  .pill{display:inline-block;padding:.3rem .8rem;border-radius:999px;font-weight:900;font-size:.85rem}
  a{color:var(--purple)}
  hr{border:none;border-top:1px solid var(--border);margin:14px 0}
</style>

var BANK = [
  /* ============ P1  LITERARY PROSE  L3 ============ */
  {
    id:"p1", level:3, genre:"Literary Prose",
    title:"Tideline", by:"Fiction · on-grade (Level 3)",
    paras:[
      "For thirty-one years, Miriam had kept the lamp at Sable Point, and for thirty-one years the sea had kept its counsel. She climbed the hundred and twelve steps each dusk the way other people said their prayers—without thinking, and therefore believing more completely. The light was not hers, strictly speaking; it belonged to the Board, to the shipping lanes, to the anonymous freighters that slid past the horizon like rumors. But the keeping was hers, and she had come to understand that a thing you tend long enough becomes a thing you own, whatever the paperwork says.",
      "Her granddaughter, Del, did not understand this. Del had arrived in June with a duffel bag and a phone that could not find a signal, and she treated the lighthouse as a sentence to be served rather than a life to be entered. “It's just a bulb now, Gran,” she said on the first night, watching the automated beacon rotate. “The Board flips a switch in an office two hundred miles away. Nobody needs you to climb anything.”",
      "Miriam did not argue. Arguing, she had learned, was a way of admitting the other person had reached you. Instead she climbed, and after a week Del climbed too—first out of boredom, then, though the girl would never have said so, out of something closer to hunger. There was a particular quality to the top of the tower at dusk: the way the land let go of its heat, the way the water turned from hammered pewter to something darker and more honest. Up there, Del stopped checking her phone.",
      "The night the storm came, the automated system failed. A relay somewhere drowned, and the great lamp went dark for the first time in a decade. Miriam felt the darkness before she saw it—felt the tower go quiet in a way that had nothing to do with sound. She was sixty-nine and her knees were a map of old betrayals, but she was already reaching for the manual crank when Del's hand closed over hers.",
      "“Tell me what to do,” Del said. Not a child's question. A keeper's.",
      "They worked the light by hand for six hours, the two of them, while the storm threw itself against the glass and the freighters, somewhere out there, found their way by a beam that no office had switched on. When dawn came gray and exhausted, Del did not mention the phone, or the signal, or the sentence she had thought she was serving. She only asked, quietly, how many steps it was to the top. “A hundred and twelve,” Miriam said. “I'll count them tomorrow,” said Del, and in the plain arithmetic of that promise, Miriam heard the sound of a thing being handed down."
    ],
    items:[
      { id:"p1i1", format:"ebsr", standard:"ELA.10.R.1.2", level:3,
        partA:{ prompt:"Part A: Which statement best identifies a central theme of “Tideline”?",
          options:[
            "Modern technology has made traditional forms of labor meaningless.",
            "Responsibility that is willingly assumed can become part of one's identity and be passed to another.",
            "Family relationships grow closest only during moments of crisis.",
            "Isolation forces people to confront the fears they have avoided."],

        partB:{ prompt:"Part B: Which quotation best supports the answer to Part A?",

            "“the storm threw itself against the glass”",

        rationale:"The theme is the idea developed across the whole story, not a single event. Miriam's line that tending something makes it “yours” and the final image of the keeping being “handed down” to Del together develop the theme of chosen responsibility becoming identity.",
        distractors:{
          "A(A)":"Tempting because Del says the light is “just a bulb,” but the story argues against this view—it's a character's mistaken starting position, not the theme.",
          "A(C)":"The storm brings them together, but the bond is built over weeks of climbing; “only during crisis” overstates one scene.",
          "A(D)":"‘Isolation/fear’ is never the focus—no fear is confronted; this misreads the setting as the point.",
          "B(A)":"Describes Del's arrival (situation), not the theme.",
          "B(C)":"Vivid imagery of the storm—a setting detail, not thematic evidence.",
          "B(D)":"Characterizes Miriam's age, unrelated to the theme of inheritance." } },
      { id:"p1i2", format:"hottext", standard:"ELA.10.R.1.3", level:3,
        prompt:"Hot-Text: Select the excerpt that best conveys, through figurative language, that Del has come to value the keeping of the light.",
        options:[
          "“Del had arrived in June with a duffel bag and a phone that could not find a signal.”",
          "“‘It's just a bulb now, Gran,’ she said on the first night.”",
          "“‘Tell me what to do,’ Del said. Not a child's question. A keeper's.”",
          "“in the plain arithmetic of that promise, Miriam heard the sound of a thing being handed down.”"],
        correct:3,
        rationale:"The winning line must do two things at once: show Del's changed values AND use figurative language. The metaphor “plain arithmetic of that promise” and the image of inheritance being “handed down” convey her transformation figuratively.",
        distractors:{
          "1":"Literal description of her arrival—no figurative language and shows her before she changes.",
          "2":"Shows her dismissive starting attitude; literal, and the opposite of valuing the light.",

      { id:"p1i3", format:"mc", standard:"ELA.10.V.1.3", level:3,
        prompt:"In paragraph 1, “the sea had kept its counsel.” As used here, counsel most nearly means:",
        options:["professional or legal advice","its silence; its private secrets","a formal governing meeting","comfort offered in hardship"],
        correct:1,
        rationale:"Context (“kept its” + the sea being mysterious and unspeaking) signals the idiom ‘keep one's counsel’ = stay silent / hold secrets. Connotation here is mystery, not advice.",
        distractors:{
          "0":"The most common dictionary meaning of ‘counsel,’ which is exactly the trap—wrong for this context.",
          "2":"Confuses ‘counsel’ with ‘council.’ The sea holds no meeting.",
          "3":"Plausible tone (the sea as companion) but not what the idiom means." } },
      { id:"p1i4", format:"multi", standard:"ELA.10.R.1.1", level:3, need:2,
        prompt:"Select TWO details that best reveal why Del begins climbing the tower despite her initial resistance.",
        options:[

        distractors:{

  /* ============ P2  INFORMATIONAL ARGUMENT  L4 ============ */
  {
    id:"p2", level:4, genre:"Informational · Argument",
    title:"The Case Against the Bell", by:"Argumentative essay · Level 4",
    paras:[
      "Every weekday, in tens of thousands of American schools, an electronic bell severs the day into identical forty-seven-minute slices. We rarely question this rhythm, perhaps because it feels as natural as a heartbeat. But a heartbeat serves the body; the bell serves the building. It is time to admit that the fixed bell schedule is a nineteenth-century factory tool wearing a twenty-first-century uniform.",
      "Consider what the bell actually rewards. It rewards stopping. A student who has finally, after thirty minutes of struggle, begun to understand quadratic functions is interrupted at the precise moment her understanding turns productive. The bell does not care that she was close; it cares only that four minutes remain to reach the next room. We have built a system that treats the most valuable state a learner can enter—deep, unbroken concentration—as an inconvenience to be scheduled around.",
      "Defenders of the bell will object, reasonably, that schools must coordinate hundreds of people, and that total freedom would collapse into chaos. This is a fair concern, and I do not propose abolishing structure. I propose replacing rigid uniformity with flexible blocks: longer, subject-integrated periods that a teacher may extend or compress based on where students actually are. Chaos is not the only alternative to the bell; thoughtful design is.",
      "The deeper cost is invisible. When we train young people, for twelve years, to associate the sound of a bell with the command to abandon whatever they are doing, we are not merely managing traffic. We are teaching a lesson—that curiosity is something you switch off on schedule. That is a strange lesson for an institution devoted to curiosity to teach. The bell is efficient. The question is whether efficiency, purchased at the price of depth, is a bargain any school should be proud to make."
    ],
    items:[
      { id:"p2i1", format:"mc", standard:"ELA.10.R.2.2", level:4,

          "The bell schedule was invented in the nineteenth century for factories.",

        correct:1,
        rationale:"A central claim is the arguable position the whole essay defends. The author explicitly rejects ‘abolishing structure’ and instead argues for flexible blocks—making choice B the precise claim.",

          "3":"Plausible but never stated; the essay is about learning, not teachers' preferences." } },
      { id:"p2i2", format:"mc", standard:"ELA.10.R.2.3", level:4,

  /* ============ P3  PAIRED TEXTS  L4  (synthesis) ============ */
  {

    paras:[
      "<b>Text 1 — “Let It Grow”</b>",
      "The American lawn is a monument to effort spent against nature. We pour billions of gallons of water and tons of fertilizer into a crop we are forbidden to harvest, all to keep it uniformly, unnaturally short. Replacing municipal lawns with native meadows would reverse this waste overnight. Meadows need no mowing, little water, and no chemicals; they feed pollinators, cool the air, and turn sterile green rectangles into living systems. The objection that meadows look ‘messy’ is not an argument—it is a habit. Beauty, like the lawn itself, is something a culture learns, and it can learn something better.",

/* ---------------- ENGINE ---------------- */
var MAX_SETS = 5;
var state = {
  screen:"briefing",
  targetLevel:3,
  usedPassages:{},
  setsDone:0,
  queue:[],           // items for current passage
  qIndex:0,
  passage:null,
  setResults:[],      // fractions for current passage
  responses:[],       // {std,level,frac}
  perStd:{}
};

function pickPassage(target){
  var best=null,bestDist=99;
  for(var i=0;i<BANK.length;i++){
    var p=BANK[i];
    if(state.usedPassages[p.id]) continue;
    var d=Math.abs(p.level-target);
    if(d<bestDist){bestDist=d;best=p;}
  }
  return best;
}

function startExam(){
  state.screen="exam";
  document.getElementById("meterWrap").style.display="block";
  loadNextPassage();
}
function loadNextPassage(){
  var p=pickPassage(state.targetLevel);
  if(!p || state.setsDone>=MAX_SETS){ showResults(); return; }
  state.usedPassages[p.id]=true;
  state.passage=p;
  state.queue=p.items.slice();
  state.qIndex=0;
  state.setResults=[];
  render();
}

function recordResponse(std,level,frac){
  state.responses.push({std:std,level:level,frac:frac});
  if(!state.perStd[std]) state.perStd[std]={sum:0,n:0};
  state.perStd[std].sum+=frac; state.perStd[std].n++;
  state.setResults.push(frac);
}

function projectedScore(){
  if(state.responses.length===0) return null;
  var earned=0,possible=0,lvlSum=0;
  for(var i=0;i<state.responses.length;i++){
    var r=state.responses[i];
    earned+=r.frac*r.level; possible+=r.level; lvlSum+=r.level;
  }
  var wAcc=possible>0?earned/possible:0;
  var avgLevel=lvlSum/state.responses.length;
  var score=Math.round(208 + wAcc*48 + (avgLevel-3)*5);
  if(score<200)score=200; if(score>262)score=262;
  return score;
}
function bandFor(score){
  if(score>=252) return {t:"Passing comfortably",c:"var(--green)"};
  if(score>=246) return {t:"On track — Level 3",c:"var(--green)"};
  if(score>=240) return {t:"Approaching — push harder",c:"var(--orange)"};
  return {t:"Below pass line — remediate",c:"var(--red)"};
}
function updateMeter(){
  var s=projectedScore();
  var fill=document.getElementById("mFill");
  var cur=document.getElementById("mCursor");
  var sc=document.getElementById("mScore");
  var bd=document.getElementById("mBand");
  if(s===null){sc.textContent="—";return;}
  var pct=((s-200)/62)*100; if(pct<0)pct=0; if(pct>100)pct=100;
  fill.style.width=pct+"%";
  cur.style.left=pct+"%";
  sc.textContent=s;
  var b=bandFor(s);
  bd.textContent="· "+b.t; bd.style.color=b.c;
}

/* ---------------- RENDER ---------------- */
var app=document.getElementById("app");
function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var passageOpen=true;

function setChip(t){document.getElementById("statusChip").textContent=t;}

function render(){
  app.innerHTML="";
  var p=state.passage, it=state.queue[state.qIndex];
  setChip("Set "+(state.setsDone+1)+" · Q"+(state.qIndex+1)+"/"+state.queue.length+" · L"+p.level);
  updateMeter();

  // passage card (collapsible)
  var pc=el("div","passage");
  var head=el("div");
  head.appendChild(el("h3",null,p.title));
  head.appendChild(el("div","by",p.genre+" · "+p.by));
  pc.appendChild(head);
  var body=el("div");
  for(var i=0;i<p.paras.length;i++){
    var isVerse=p.genre==="Poetry";
    var pref = (!isVerse && !/^<b>|^<i>/.test(p.paras[i])) ? '<span class="pnum">'+(countableIndex(p,i))+'</span>' : '';
    body.appendChild(el("p",null,pref+p.paras[i]));
  }
  pc.appendChild(body);
  var tgl=el("button","ptoggle", passageOpen?"▾ Hide passage":"▸ Show passage");
  tgl.onclick=function(){passageOpen=!passageOpen;body.style.display=passageOpen?"block":"none";tgl.textContent=passageOpen?"▾ Hide passage":"▸ Show passage";};
  body.style.display=passageOpen?"block":"none";
  pc.insertBefore(tgl, body);
  app.appendChild(pc);

  // progress dots for this set
  var pr=el("div","prog");
  for(var j=0;j<state.queue.length;j++){
    var d=el("i",j<state.qIndex?"done":(j===state.qIndex?"cur":""));
    pr.appendChild(d);
  }
  app.appendChild(pr);

  // item card
  app.appendChild(renderItem(it));
  window.scrollTo(0,0);
}
function countableIndex(p,i){
  // paragraph number ignoring heading-only lines
  var n=0;
  for(var k=0;k<=i;k++){ if(!/^<b>|^<i>/.test(p.paras[k])) n++; }
  return n;
}

function fmtLabel(f){
  return {mc:"Multiple Choice",multi:"Multi-Select",ebsr:"EBSR · Part A/B",hottext:"Hot-Text",categorize:"Categorize"}[f]||f;
}

function renderItem(it){
  var card=el("div","card");
  var qh=el("div","qhead");
  qh.appendChild(el("span","qn","Question "+(state.qIndex+1)));
  qh.appendChild(el("span","fmt",fmtLabel(it.format)));
  card.appendChild(qh);

  var answered=false;
  var submit=el("button","btn","Submit Answer");
  submit.disabled=true;

  if(it.format==="mc"||it.format==="hottext"){
    card.appendChild(el("div","prompt",it.prompt));
    var sel=-1;
    var ul=el("div","list");
    it.options.forEach(function(o,idx){
      var li=el("div","opt");
      li.appendChild(el("span","k",String.fromCharCode(65+idx)));
      li.appendChild(el("span",null,o));
      li.onclick=function(){ if(answered)return; sel=idx; [].forEach.call(ul.children,function(c){c.classList.remove("sel");}); li.classList.add("sel"); submit.disabled=false; };
      ul.appendChild(li);
    });
    card.appendChild(ul);
    submit.onclick=function(){
      if(sel<0||answered)return; answered=true; submit.style.display="none";
      var correct=(sel===it.correct); var frac=correct?1:0;
      [].forEach.call(ul.children,function(c,idx){
        c.classList.add("disabled"); c.classList.remove("sel");
        if(idx===it.correct)c.classList.add("correct");
        else if(idx===sel)c.classList.add("wrong");
      });
      recordResponse(it.standard,it.level,frac); updateMeter();
      card.appendChild(feedback(it,correct?"good":"bad",correct?"Correct":"Not quite",selDistractKey(it,sel)));
      card.appendChild(nextBtn());
    };
  }
  else if(it.format==="multi"){
    card.appendChild(el("div","prompt",it.prompt));
    card.appendChild(el("div","sub","Select "+it.need+"."));
    var picks={};
    var ul2=el("div","list");
    it.options.forEach(function(o,idx){
      var li=el("div","opt");
      li.appendChild(el("span","k",String.fromCharCode(65+idx)));
      li.appendChild(el("span",null,o));
      li.onclick=function(){ if(answered)return;
        if(picks[idx]){delete picks[idx];li.classList.remove("sel");}
        else{ if(Object.keys(picks).length>=it.need)return; picks[idx]=true; li.classList.add("sel"); }
        submit.disabled=(Object.keys(picks).length!==it.need);
      };
      ul2.appendChild(li);
    });
    card.appendChild(ul2);
    submit.onclick=function(){
      if(answered)return; answered=true; submit.style.display="none";
      var chosen=Object.keys(picks).map(Number);
      var correctSet=it.correct;
      var hit=0; chosen.forEach(function(c){ if(correctSet.indexOf(c)>=0)hit++; });
      var frac=hit/it.need;
      [].forEach.call(ul2.children,function(c,idx){
        c.classList.add("disabled"); c.classList.remove("sel");
        if(correctSet.indexOf(idx)>=0)c.classList.add("correct");
        else if(chosen.indexOf(idx)>=0)c.classList.add("wrong");
      });
      recordResponse(it.standard,it.level,frac); updateMeter();
      var v=frac===1?"Correct — both right":(frac>0?"Partially correct":"Not quite");
      card.appendChild(feedback(it,frac===1?"good":(frac>0?"part":"bad"),v,null));
      card.appendChild(nextBtn());
    };
  }
  else if(it.format==="ebsr"){
    card.appendChild(el("div","partlabel","Part A"));
    card.appendChild(el("div","prompt",it.partA.prompt));
    var selA=-1;
    var ulA=el("div","list");
    it.partA.options.forEach(function(o,idx){
      var li=el("div","opt");
      li.appendChild(el("span","k",String.fromCharCode(65+idx)));
      li.appendChild(el("span",null,o));
      li.onclick=function(){ if(answered)return; selA=idx; [].forEach.call(ulA.children,function(c){c.classList.remove("sel");}); li.classList.add("sel"); checkReady(); };
      ulA.appendChild(li);
    });
    card.appendChild(ulA);
    card.appendChild(el("div","partlabel","Part B"));
    card.appendChild(el("div","prompt",it.partB.prompt));
    var selB=-1;
    var ulB=el("div","list");
    it.partB.options.forEach(function(o,idx){
      var li=el("div","opt");
      li.appendChild(el("span","k",String.fromCharCode(65+idx)));
      li.appendChild(el("span",null,o));
      li.onclick=function(){ if(answered)return; selB=idx; [].forEach.call(ulB.children,function(c){c.classList.remove("sel");}); li.classList.add("sel"); checkReady(); };
      ulB.appendChild(li);
    });
    card.appendChild(ulB);
    function checkReady(){ submit.disabled=!(selA>=0&&selB>=0); }
    submit.onclick=function(){
      if(answered)return; answered=true; submit.style.display="none";
      var aOK=(selA===it.partA.correct), bOK=(selB===it.partB.correct);
      var frac=(aOK&&bOK)?1:((aOK||bOK)?0.5:0);
      mark(ulA,selA,it.partA.correct); mark(ulB,selB,it.partB.correct);
      recordResponse(it.standard,it.level,frac); updateMeter();
      var v=frac===1?"Full credit — A + B":(frac===0.5?"Half credit — only one part":"Not quite");
      var extra="<b>Scoring:</b> On FAST EBSR, your evidence (Part B) must match your analysis (Part A). Both must be right for full credit.";
      card.appendChild(feedback(it,frac===1?"good":(frac===0.5?"part":"bad"),v,null,extra));
      card.appendChild(nextBtn());
    };
    function mark(ul,sel,cor){ [].forEach.call(ul.children,function(c,idx){ c.classList.add("disabled");c.classList.remove("sel"); if(idx===cor)c.classList.add("correct"); else if(idx===sel)c.classList.add("wrong"); }); }
  }
  else if(it.format==="categorize"){
    card.appendChild(el("div","prompt",it.prompt));
    var selects=[];
    it.rows.forEach(function(row,idx){
      var r=el("div","catrow");
      r.appendChild(el("div","ctext","• "+row.text));
      var s=el("select","cat");
      var def=el("option",null,"— choose —"); def.value=""; s.appendChild(def);
      it.categories.forEach(function(cat,ci){ var op=el("option",null,cat); op.value=ci; s.appendChild(op); });
      s.onchange=function(){ var all=selects.every(function(x){return x.value!=="";}); submit.disabled=!all; };
      selects.push(s); r.appendChild(s); card.appendChild(r);
    });
    submit.onclick=function(){
      if(answered)return; answered=true; submit.style.display="none";
      var hit=0;
      selects.forEach(function(s,idx){
        var chosen=parseInt(s.value,10); var cor=it.rows[idx].cat;
        s.disabled=true;
        if(chosen===cor){s.classList.add("correct");hit++;}
        else{s.classList.add("wrong"); s.appendChild(optCorrect(it.categories[cor]));}
      });
      var frac=hit/it.rows.length;
      recordResponse(it.standard,it.level,frac); updateMeter();
      var v=frac===1?"Correct — all placed":(frac>0?("Partially correct — "+hit+"/"+it.rows.length):"Not quite");
      card.appendChild(feedback(it,frac===1?"good":(frac>0?"part":"bad"),v,null));
      card.appendChild(nextBtn());
    };
  }

  card.appendChild(submit);
  return card;
}
function optCorrect(txt){var o=document.createElement("option");o.textContent=" ✓ correct: "+txt;o.disabled=true;return o;}

function selDistractKey(it,sel){
  // returns a distractor note string for the chosen wrong option, if any
  if(it.format==="hottext"||it.format==="mc"){
    if(sel===it.correct) return null;
    return it.distractors?it.distractors[String(sel)]:null;
  }
  return null;
}

function feedback(it,cls,verdict,distractNote,extraHtml){
  var f=el("div","fb "+cls);
  var icon=cls==="good"?"✅":(cls==="part"?"◐":"❌");
  f.appendChild(el("div","v",icon+" "+verdict));
  f.appendChild(el("div","why","<b>Why:</b> "+it.rationale));
  if(extraHtml) f.appendChild(el("div","why",extraHtml));
  if(distractNote){ f.appendChild(el("div","dis","<b>Your choice:</b> "+distractNote)); }
  f.appendChild(el("div","std",it.standard+" · "+(STANDARD_NAMES[it.standard]||"")));
  return f;
}

function nextBtn(){
  var last=(state.qIndex>=state.queue.length-1);
  var b=el("button","btn gold",last?"Finish this set →":"Next question →");
  b.style.marginTop="10px";
  b.onclick=function(){
    if(state.qIndex<state.queue.length-1){ state.qIndex++; render(); }
    else{ endSet(); }
  };
  return b;
}

function endSet(){
  // adapt difficulty based on set accuracy
  var acc = state.setResults.reduce(function(a,b){return a+b;},0)/state.setResults.length;
  state.setsDone++;
  var old=state.targetLevel;
  if(acc>=0.7) state.targetLevel=Math.min(5,state.targetLevel+1);
  else if(acc<0.5) state.targetLevel=Math.max(2,state.targetLevel-1);
  showSetBreak(acc,old,state.targetLevel);
}

function showSetBreak(acc,old,neo){
  app.innerHTML="";
  setChip("Set "+state.setsDone+" complete");
  updateMeter();
  var c=el("div","card center");
  var pctv=Math.round(acc*100);
  c.appendChild(el("div","big",pctv+"%"));
  c.appendChild(el("div","lead","Set "+state.setsDone+" accuracy"));
  var dir = neo>old ? "↑ Escalating to Level "+neo+" — harder texts & subtler questions." :
            neo<old ? "↓ Adapting to Level "+neo+" — rebuilding the foundation with targeted items." :
            "→ Holding at Level "+neo+" — dialing in.";
  var col = neo>old?"var(--green)":(neo<old?"var(--orange)":"var(--muted)");
  var pill=el("div","pill",dir); pill.style.background="rgba(139,92,246,.12)"; pill.style.border="1px solid var(--border)"; pill.style.color=col; pill.style.fontSize=".8rem";
  c.appendChild(pill);
  var s=projectedScore();
  c.appendChild(el("p",null,"<br>Projected scale score: <b style='color:"+bandFor(s).c+"'>"+s+"</b> / 246 to pass"));
  app.appendChild(c);
  var done=(state.setsDone>=MAX_SETS)||!pickPassage(state.targetLevel);
  var b=el("button","btn",done?"See my full results →":"Continue to Set "+(state.setsDone+1)+" →");
  b.onclick=function(){ if(done)showResults(); else loadNextPassage(); };
  app.appendChild(b);
  window.scrollTo(0,0);
}

function showResults(){
  state.screen="results";
  app.innerHTML="";
  setChip("Results");
  var s=projectedScore(); var band=bandFor(s);
  updateMeter();

  var head=el("div","card center");
  head.appendChild(el("div","lead","Predicted FAST Scale Score"));
  var big=el("div","big",String(s)); big.style.color=band.c;
  head.appendChild(big);
  var pass=s>=246;
  var pill=el("div","pill",(pass?"✓ ":"⚠ ")+band.t);
  pill.style.background=pass?"rgba(34,197,94,.14)":"rgba(249,115,22,.14)";
  pill.style.color=band.c; pill.style.border="1px solid "+band.c; pill.style.marginTop="8px";
  head.appendChild(pill);
  head.appendChild(el("p","lead","<br>Passing requires <b>246 (Level 3)</b>. "+(pass?"You're projecting a pass — keep this pace and lock it in.":"You're "+(246-s)+" points short. The gaps below are exactly where those points are hiding.")));
  app.appendChild(head);

  // per-standard breakdown
  var sc=el("div","card");
  sc.appendChild(el("h2",null,"Standard-by-Standard"));
  var keys=Object.keys(state.perStd);
  keys.sort(function(a,b){ return (state.perStd[a].sum/state.perStd[a].n)-(state.perStd[b].sum/state.perStd[b].n); });
  keys.forEach(function(k){
    var o=state.perStd[k]; var pct=Math.round((o.sum/o.n)*100);
    var col=pct<60?"var(--red)":(pct<80?"var(--orange)":"var(--green)");
    var row=el("div"); row.style.margin="10px 0";
    var top=el("div"); top.style.display="flex"; top.style.justifyContent="space-between"; top.style.fontSize=".8rem"; top.style.fontWeight="800";
    top.innerHTML="<span>"+k+" · <span style='color:var(--muted);font-weight:700'>"+(STANDARD_NAMES[k]||"")+"</span></span><span style='color:"+col+"'>"+pct+"%</span>";
    row.appendChild(top);
    var bar=el("div","bar"); var fill=el("i"); fill.style.width=pct+"%"; fill.style.background=col; bar.appendChild(fill); row.appendChild(bar);
    sc.appendChild(row);
  });
  app.appendChild(sc);

  // focus plan
  var weak=keys.slice(0,3).filter(function(k){return (state.perStd[k].sum/state.perStd[k].n)<0.8;});
  var plan=el("div","card");
  plan.appendChild(el("h2",null,"🎯 Your Cram Focus"));
  if(weak.length===0){
    plan.appendChild(el("p","lead","Balanced and strong across the board. Do one more full run at Level 4–5 to build a cushion above 246."));
  } else {
    var ul=el("ul"); ul.style.paddingLeft="18px"; ul.style.fontSize=".9rem"; ul.style.fontWeight="600";
    weak.forEach(function(k){
      var tip=FOCUS_TIPS[k]||"Re-read the passage before answering; anchor every choice to a specific line.";
      var li=document.createElement("li"); li.style.margin="8px 0";
      li.innerHTML="<b>"+(STANDARD_NAMES[k]||k)+"</b> ("+k+"): "+tip;
      ul.appendChild(li);
    });
    plan.appendChild(ul);
  }
  app.appendChild(plan);

  var again=el("button","btn","Run a fresh adaptive set →");
  again.onclick=function(){ resetAll(); };
  app.appendChild(again);
  var b2=el("button","btn ghost","Back to strategy briefing");
  b2.style.marginTop="8px";
  b2.onclick=function(){ resetAll(true); };
  app.appendChild(b2);

  app.appendChild(el("div","note","Practice content is original and aligned to Florida B.E.S.T. ELA.10 benchmarks. Projected scores are a study estimate to guide preparation — not an official FAST result."));
  window.scrollTo(0,0);
}

var FOCUS_TIPS={
  "ELA.10.R.1.1":"Tie each character's action to a motive stated or implied in the text; don't pick 'true but irrelevant' details.",
  "ELA.10.R.1.2":"Theme = the idea developed across the whole passage. Ask 'what is this really about?' before scanning options.",
  "ELA.10.R.1.3":"For figurative-language items, name the device AND its effect; the answer usually captures both.",
  "ELA.10.R.2.1":"Central idea summarizes the whole text; supporting details are the specific facts underneath it.",
  "ELA.10.R.2.2":"Track WHY the author wrote it and HOW (rhetorical moves), not just what is said.",
  "ELA.10.R.2.3":"Separate the claim from the evidence; identify concessions and rebuttals.",
  "ELA.10.R.2.4":"Judge whether evidence actually supports the claim; watch for missing data and overstated distractors.",
  "ELA.10.R.3.1":"Pin down the exact axis on which paired authors differ before comparing.",
  "ELA.10.R.3.3":"Synthesis = real common ground; your evidence must come from BOTH texts.",
  "ELA.10.V.1.3":"Plug each choice back into the sentence; the dictionary meaning is often the trap."
};

function resetAll(toBriefing){
  state.targetLevel=3; state.usedPassages={}; state.setsDone=0; state.queue=[]; state.qIndex=0;
  state.passage=null; state.setResults=[]; state.responses=[]; state.perStd={};
  document.getElementById("mFill").style.width="0%";
  document.getElementById("mCursor").style.left="0%";
  document.getElementById("mScore").textContent="—";
  document.getElementById("mBand").textContent="";
  if(toBriefing){ document.getElementById("meterWrap").style.display="none"; renderBriefing(); }
  else { startExam(); }
}

/* ---------------- BRIEFING ---------------- */
function renderBriefing(){
  state.screen="briefing"; setChip("Briefing");
  app.innerHTML="";
  app.appendChild(el("h1",null,"FAST Grade 10 ELA<br>Retake — Cram &amp; Mastery"));
  app.appendChild(el("div","lead","Adaptive practice built to get you across the <b>246</b> line (Level 3) for graduation. Feedback is instant after every question, and the difficulty adapts to you in real time."));

  var s=el("div","card");
  s.appendChild(el("h2",null,"⚡ 5 tactics that win the retake"));
  var tips=[
    ["Protect easy points first.","You don't need perfection for 246 — you need to stop losing points to careless reading and steal a few hard ones."],
    ["EBSR: check Part B first.","Your evidence (B) must match your analysis (A). Skim the evidence options; if only one A-answer has matching proof, that's it."],
    ["Hot-Text: most direct line wins.","Pick the line that explicitly states the answer — not the one that merely feels related."],
    ["Multi-Select: count & isolate.","'Select TWO' means exactly two, each correct on its own. Distractors are usually true-but-off-topic."],
    ["Pace ~10–12 min per set.","Read once, actively. Let questions send you back for evidence. Never re-read the whole passage per question."]
  ];
  tips.forEach(function(t,i){
    var d=el("div"); d.style.margin="10px 0"; d.style.paddingLeft="26px"; d.style.position="relative";
    var n=el("span",null,String(i+1)); n.style.position="absolute";n.style.left="0";n.style.top="0";n.style.width="20px";n.style.height="20px";n.style.borderRadius="50%";n.style.background="var(--purple)";n.style.color="#fff";n.style.fontSize=".7rem";n.style.fontWeight="900";n.style.display="flex";n.style.alignItems="center";n.style.justifyContent="center";
    d.appendChild(n);
    d.innerHTML+="<b style='font-size:.92rem'>"+t[0]+"</b><div style='font-size:.82rem;color:var(--muted);font-weight:600;margin-top:2px'>"+t[1]+"</div>";
    s.appendChild(d);
  });
  app.appendChild(s);

  var s2=el("div","card tight");
  s2.appendChild(el("h2",null,"How the engine adapts"));
  s2.appendChild(el("p","lead","Start at <b>Level 3</b> (on-grade). Score ≥70% on a passage set → escalate to Level 4–5 (denser texts, dual-text synthesis, subtle intent). Slip below 50% → the engine drops to Level 2–3 to rebuild the foundation. A live meter tracks your projected scale score against 246 the whole way."));
  app.appendChild(s2);

  var go=el("button","btn","Start Adaptive Simulation →");
  go.onclick=startExam;
  app.appendChild(go);
  app.appendChild(el("div","note","Original B.E.S.T.-aligned practice. Not affiliated with FDOE; projected scores are a study estimate."));
  window.scrollTo(0,0);
}

renderBriefing();
</script>
